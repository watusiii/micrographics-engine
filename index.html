<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Micrographic Engine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/opentype.js@latest/dist/opentype.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paper.js/0.12.17/paper-full.min.js"></script>
    <style>
        @font-face {
            font-family: 'Roboto Mono';
            src: url('fonts/roboto-mono/RobotoMono-Regular.ttf') format('truetype');
            font-weight: 400;
            font-style: normal;
        }

        @font-face {
            font-family: 'Roboto Mono';
            src: url('fonts/roboto-mono/RobotoMono-Bold.ttf') format('truetype');
            font-weight: 700;
            font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body,
        html {
            height: 100%;
            font-family: 'Inter', sans-serif;
            background: #000;
            color: #000;
        }

        .container {
            display: grid;
            grid-template-rows: 1fr auto;
            grid-template-columns: 250px 1fr;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        .sidebar {
            grid-row: 1;
            grid-column: 1;
            background: #d4d4d4;
            border-right: 2px solid #000;
            border-bottom: 2px solid #000;
            padding: 10px;
            overflow-y: auto;
            line-height: 1.2;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #000;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #333;
        }

        .sidebar h2 {
            font-size: 20px;
            font-weight: 900;
            margin: 0 0 8px 0;
            background: transparent;
            color: #000;
            padding: 0;
        }

        .canvas-controls {
            margin-bottom: 10px;
            border-bottom: 1px solid #000;
            padding-bottom: 10px;
        }

        .size-inputs {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .size-inputs input {
            width: 70px;
            padding: 0;
            margin: 0;
            font-family: inherit;
            border: none;
            background: transparent;
            font-size: 24px;
            font-weight: 400;
            text-align: center;
        }

        /* Hide number input spinners */
        .size-inputs input[type=number]::-webkit-inner-spin-button,
        .size-inputs input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .size-inputs input[type=number] {
            -moz-appearance: textfield;
            appearance: textfield;
        }

        .size-inputs input:focus {
            outline: 1px solid #000;
            outline-offset: 2px;
        }

        .size-inputs .x {
            font-size: 18px;
            font-weight: 900;
        }

        .grid-toggle {
            font-size: 9px;
            font-weight: bold;
            margin: 0;
        }

        .font-upload {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #000;
        }

        .font-upload label {
            font-size: 9px;
            font-weight: bold;
            display: block;
            margin-bottom: 4px;
        }

        .font-upload input[type="file"] {
            font-size: 9px;
            width: 100%;
        }

        .font-name-display {
            font-size: 8px;
            margin-top: 4px;
            opacity: 0.6;
        }

        .grid-toggle input {
            width: auto;
            margin-right: 6px;
            font-size: inherit;
        }

        .sidebar-item {
            background: transparent;
            border: none;
            border-bottom: 1px solid #000;
            padding: 6px 0;
            margin: 0;
            display: flex;
            align-items: center;
            font-size: 10px;
            cursor: move;
            user-select: none;
        }

        .sidebar-item:last-child {
            border-bottom: none;
        }

        .sidebar-item.dragging {
            opacity: 0.5;
        }

        .sidebar-item.drag-over {
            border-top: 3px solid #000;
        }

        .sidebar-item.selected {
            background: #000;
            color: #fff;
        }

        .add-button {
            background: none;
            border: none;
            padding: 4px;
            margin-bottom: 6px;
            font-size: 20px;
            cursor: pointer;
            text-align: left;
            width: 100%;
            font-weight: bold;
        }

        .add-button:hover {
            background: rgba(0, 0, 0, 0.1);
        }

        .main-content {
            grid-row: 1;
            grid-column: 2;
            background: #d4d4d4;
            border-bottom: 2px solid #000;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .bottom-section {
            grid-row: 2;
            grid-column: 1 / -1;
            background: #d4d4d4;
            position: relative;
            height: 200px;
            min-height: 200px;
            max-height: 200px;
            display: flex;
        }

        #edit-panel {
            flex: 1;
            background: #d4d4d4;
            border-right: 2px solid #000;
            padding: 0 15px 15px 15px;
            overflow-y: auto;
            display: none;
        }

        #edit-panel.visible {
            display: block;
        }

        #edit-panel h3 {
            font-size: 20px;
            font-weight: 900;
            margin: 0 0 8px 0;
            background: transparent;
            color: #000;
            padding: 10px 0 8px 0;
        }

        #edit-panel label {
            display: block;
            margin-bottom: 4px;
            font-size: 9px;
            font-weight: bold;
            text-transform: uppercase;
        }

        #edit-panel input,
        #edit-panel select,
        #edit-panel textarea {
            width: 100%;
            padding: 8px 6px;
            font-family: inherit;
            border: 1px solid #000;
            background: transparent;
            margin-bottom: 10px;
            font-size: 12px;
            box-sizing: border-box;
        }

        #edit-panel input:focus,
        #edit-panel select:focus,
        #edit-panel textarea:focus {
            outline: 2px solid #000;
            outline-offset: 1px;
        }

        #edit-panel input[type=number]::-webkit-inner-spin-button,
        #edit-panel input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        #edit-panel input[type=number] {
            -moz-appearance: textfield;
            appearance: textfield;
        }

        #edit-panel button {
            padding: 8px 16px;
            background: #000;
            color: #fff;
            border: 2px solid #000;
            font-family: inherit;
            cursor: pointer;
            font-weight: bold;
            font-size: 11px;
            margin-right: 8px;
        }

        #edit-panel button:hover {
            background: #333;
        }

        #edit-panel button.danger {
            background: transparent;
            color: #000;
        }

        #edit-panel button.danger:hover {
            background: #000;
            color: #d4d4d4;
        }

        .table-rows {
            margin-bottom: 10px;
        }

        .table-row-item {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
            align-items: stretch;
        }

        .table-row-item input {
            margin-bottom: 0;
            padding: 6px;
            flex: 1;
            min-width: 0;
        }

        .table-row-item button {
            margin: 0;
            padding: 6px 10px;
            font-size: 16px;
            flex-shrink: 0;
        }

        #canvas {
            display: block;
            border: 1px dotted #000;
            background: transparent;
            position: relative;
        }

        .canvas-wrapper {
            position: relative;
            display: inline-block;
        }

        .canvas-handle {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #000;
            cursor: pointer;
            z-index: 10;
        }

        .canvas-handle.tl {
            top: -4px;
            left: -4px;
            cursor: nwse-resize;
        }

        .canvas-handle.tr {
            top: -4px;
            right: -4px;
            cursor: nesw-resize;
        }

        .canvas-handle.bl {
            bottom: -4px;
            left: -4px;
            cursor: nesw-resize;
        }

        .canvas-handle.br {
            bottom: -4px;
            right: -4px;
            cursor: nwse-resize;
        }

        #diagnostic-panel {
            width: 180px;
            flex-shrink: 0;
            background: transparent;
            border-left: 2px solid #000;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
        }

        #diagnostic-panel header {
            font-size: 20px;
            font-weight: 900;
            padding: 10px 8px 8px 8px;
            background: transparent;
            color: #000;
        }

        #diagnostic-panel .content {
            padding: 8px;
            background: #d4d4d4;
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        #diagnostic-panel .x-diagram {
            width: 100%;
            height: 60px;
            margin-bottom: 8px;
        }

        #diagnostic-panel .x-diagram svg {
            max-height: 60px;
        }

        #diagnostic-panel .stats {
            font-size: 8px;
            line-height: 1.4;
            word-wrap: break-word;
        }

        #diagnostic-panel #diag-font {
            font-size: 7px;
            margin-top: 5px;
        }
    </style>
</head>

<body>
    <div class="container">
        <aside class="sidebar">
            <h2>S</h2>
            <div class="canvas-controls">
                <div class="size-inputs">
                    <input type="number" id="canvas-width" value="">
                    <span class="x">×</span>
                    <input type="number" id="canvas-height" value="">
                </div>
                <label class="grid-toggle">
                    <input type="checkbox" id="grid-toggle" checked> GRID
                </label>
                <div class="font-upload">
                    <label for="font-file">FONT (.ttf/.otf)</label>
                    <input type="file" id="font-file" accept=".ttf,.otf,.woff,.woff2">
                    <div class="font-name-display" id="current-font">Roboto Mono</div>
                </div>
            </div>
            <h2>E</h2>
            <button class="add-button" id="add-element">+</button>
            <div id="sidebar-list"></div>
        </aside>
        <main class="main-content">
            <div class="canvas-wrapper">
                <canvas id="canvas"></canvas>
                <div class="canvas-handle tl" data-corner="tl"></div>
                <div class="canvas-handle tr" data-corner="tr"></div>
                <div class="canvas-handle bl" data-corner="bl"></div>
                <div class="canvas-handle br" data-corner="br"></div>
            </div>
        </main>
        <div class="bottom-section">
            <div id="edit-panel">
                <h3>X</h3>
                <div id="edit-form"></div>
            </div>
            <aside id="diagnostic-panel">
                <header>U</header>
                <div class="content">
                    <div class="x-diagram" id="x-diagram"></div>
                    <div class="stats">
                        <div id="diag-info">1U = --</div>
                        <div id="diag-font" style="margin-top: 5px; font-size: 8px;">FONT: --</div>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <script>
        let elements = [
            { type: "B", icon: "svg", svgPath: "logos/extendo.svg", label: "EXTENDO" },
            { type: "A", text: "FRAME 00000000", fontSize: 1.2 },
            {
                type: "C", rows: [
                    { label: "RESOLUTION", value: "42.IN/400x300" },
                    { label: "BOARD", value: "ESP32-S3" }
                ]
            },

            {
                type: "C", rows: [
                    { label: "BALLISTICS", value: "PETG" }
                ]
            },
            { type: "B", icon: "svg", svgPath: "logos/healthgoth.svg", label: "TAG" },
            { type: "B", icon: "svg", svgPath: "logos/wideglobe.svg", label: "GLOBE" },
            {
                type: "C", rows: [
                    { label: "POWER", value: "80mW" }
                ]
            },
            // { type: "B", icon: "svg", svgPath: "logos/stroke-svg.svg", label: "PATTERN 2" },
            { type: "B", icon: "svg", svgPath: "logos/paper-logo-black.svg", label: "VIVA" },
            { type: "B", icon: "svg", svgPath: "logos/extendo_nes.svg", label: "EXTENDO NES" },
            { type: "A", text: "Truth by Design", fontSize: 0.8 }

        ];

        let BASE_UNIT = 50;
        let UNIT = 50;
        let GRID_SIZE = 50;
        let GUTTER = 25;
        let ICON_SIZE = 100;
        let CANVAS_WIDTH = 200;
        let CANVAS_HEIGHT = 278;
        let font = null;
        let svgCache = {};
        let FONT_NAME = 'Roboto Mono';
        let selectedElementIndex = null;
        let showGrid = true;

        async function loadSVG(path) {
            if (svgCache[path]) return svgCache[path];
            try {
                const response = await fetch(path);
                const svgText = await response.text();
                svgCache[path] = svgText;
                return svgText;
            } catch (err) {
                console.error('SVG load failed:', path, err);
                return null;
            }
        }

        async function loadFont(arrayBuffer = null, fontName = 'Roboto Mono') {
            try {
                if (!arrayBuffer) {
                    // Load default font
                    const fontUrl = 'fonts/roboto-mono/RobotoMono-Regular.ttf';
                    const response = await fetch(fontUrl);
                    arrayBuffer = await response.arrayBuffer();
                }

                font = opentype.parse(arrayBuffer);

                const unitsPerEm = font.unitsPerEm;
                const sxHeight = font.tables.os2.sxHeight;
                const baseFontSize = 100;
                const scale = baseFontSize / unitsPerEm;
                BASE_UNIT = sxHeight * scale;
                UNIT = BASE_UNIT;

                // Update font name
                FONT_NAME = fontName;

                // Load as web font via CSS FontFace API
                const blob = new Blob([arrayBuffer]);
                const fontUrl = URL.createObjectURL(blob);
                const fontFace = new FontFace(fontName, `url(${fontUrl})`);
                await fontFace.load();
                document.fonts.add(fontFace);

                // Update UI
                document.getElementById('diag-info').textContent = `1U = ${BASE_UNIT.toFixed(1)}px`;
                document.getElementById('diag-font').textContent = `FONT: ${FONT_NAME}`;
                document.getElementById('current-font').textContent = fontName;
                renderXDiagram(sxHeight, unitsPerEm, baseFontSize);
            } catch (err) {
                console.error('Font load failed:', err);
                alert('Font loading failed. Using previous font.');
            }
        }

        function renderXDiagram(sxHeight, unitsPerEm, baseFontSize) {
            const container = document.getElementById('x-diagram');
            const svgNS = "http://www.w3.org/2000/svg";
            const svg = document.createElementNS(svgNS, "svg");
            svg.setAttribute("width", "100%");
            svg.setAttribute("height", "60");

            if (!font) return;

            const glyph = font.charToGlyph('x');
            const baseline = 48;
            const centerX = 100;
            const renderSize = 45;
            const path = glyph.getPath(centerX, baseline, renderSize);

            const pathElement = document.createElementNS(svgNS, "path");
            pathElement.setAttribute("d", path.toPathData());
            pathElement.setAttribute("fill", "black");
            svg.appendChild(pathElement);

            const bbox = glyph.getBoundingBox();
            const scale = renderSize / unitsPerEm;
            const leftEdge = centerX + (bbox.x1 * scale);
            const rightEdge = centerX + (bbox.x2 * scale);
            const displayXHeight = sxHeight * scale;

            const topY = baseline - displayXHeight;
            const bottomY = baseline;

            const topLine = document.createElementNS(svgNS, "line");
            topLine.setAttribute("x1", leftEdge);
            topLine.setAttribute("y1", topY);
            topLine.setAttribute("x2", rightEdge);
            topLine.setAttribute("y2", topY);
            topLine.setAttribute("stroke", "black");
            topLine.setAttribute("stroke-width", "1");
            topLine.setAttribute("stroke-dasharray", "2,2");

            const bottomLine = document.createElementNS(svgNS, "line");
            bottomLine.setAttribute("x1", leftEdge);
            bottomLine.setAttribute("y1", bottomY);
            bottomLine.setAttribute("x2", rightEdge);
            bottomLine.setAttribute("y2", bottomY);
            bottomLine.setAttribute("stroke", "black");
            bottomLine.setAttribute("stroke-width", "1");
            bottomLine.setAttribute("stroke-dasharray", "2,2");

            svg.appendChild(topLine);
            svg.appendChild(bottomLine);
            svg.setAttribute("viewBox", `0 0 200 60`);

            container.innerHTML = '';
            container.appendChild(svg);
        }

        async function createIcon(type, size, svgPath) {
            const group = new paper.Group();
            const sw = size * 0.08;

            if (type === 'svg' && svgPath) {
                const svgData = await loadSVG(svgPath);
                if (svgData) {
                    const imported = paper.project.importSVG(svgData);

                    // Get bounds after import
                    const bounds = imported.bounds;
                    const naturalWidth = bounds.width;
                    const naturalHeight = bounds.height;

                    // Check if bounds are valid
                    if (!naturalWidth || !naturalHeight || naturalWidth === 0 || naturalHeight === 0) {
                        console.warn('Invalid SVG bounds for', svgPath);
                        return group;
                    }

                    const aspectRatio = naturalWidth / naturalHeight;

                    let targetWidth, targetHeight;

                    if (aspectRatio > 2) {
                        // Wide logo: 4U x 1U or 3U x 1U
                        const gridUnits = aspectRatio > 3 ? 4 : 3;
                        targetWidth = size * gridUnits / 2;  // size is 2U base
                        targetHeight = targetWidth / aspectRatio;
                    } else if (aspectRatio < 0.5) {
                        // Tall logo: 1U x 3U or 1U x 4U
                        const gridUnits = aspectRatio < 0.33 ? 4 : 3;
                        targetHeight = size * gridUnits / 2;
                        targetWidth = targetHeight * aspectRatio;
                    } else {
                        // Square-ish: maintain aspect ratio within size
                        const scaleFactor = size / Math.max(naturalWidth, naturalHeight);
                        targetWidth = naturalWidth * scaleFactor;
                        targetHeight = naturalHeight * scaleFactor;
                    }

                    // Scale uniformly to maintain aspect ratio
                    const scaleX = targetWidth / naturalWidth;
                    const scaleY = targetHeight / naturalHeight;
                    const uniformScale = Math.min(scaleX, scaleY);

                    imported.scale(uniformScale);
                    group.addChild(imported);
                }
                return group;
            }

            switch (type) {
                case 'square':
                    group.addChild(new paper.Path.Rectangle({
                        point: [0, 0],
                        size: [size, size],
                        strokeColor: 'black',
                        strokeWidth: sw
                    }));
                    break;
                case 'triangle':
                    group.addChild(new paper.Path({
                        segments: [[size / 2, 0], [0, size], [size, size]],
                        closed: true,
                        strokeColor: 'black',
                        strokeWidth: sw
                    }));
                    break;
                case 'circle':
                    group.addChild(new paper.Path.Circle({
                        center: [size / 2, size / 2],
                        radius: size / 2,
                        strokeColor: 'black',
                        strokeWidth: sw
                    }));
                    break;
                case 'lightning':
                    group.addChild(new paper.Path({
                        segments: [[size * 0.6, 0], [size * 0.1, size * 0.6], [size * 0.5, size * 0.6], [size * 0.4, size], [size * 0.9, size * 0.4], [size * 0.5, size * 0.4]],
                        closed: true,
                        strokeColor: 'black',
                        strokeWidth: sw
                    }));
                    break;
                case 'skull':
                    group.addChildren([
                        new paper.Path.Circle({ center: [size * 0.5, size * 0.35], radius: size * 0.25, strokeColor: 'black', strokeWidth: sw }),
                        new paper.Path.Rectangle({ point: [size * 0.3, size * 0.55], size: [size * 0.4, size * 0.3], strokeColor: 'black', strokeWidth: sw }),
                        new paper.Path.Circle({ center: [size * 0.38, size * 0.32], radius: size * 0.06, fillColor: 'black' }),
                        new paper.Path.Circle({ center: [size * 0.62, size * 0.32], radius: size * 0.06, fillColor: 'black' })
                    ]);
                    break;
            }
            return group;
        }

        async function renderContent(canvasWidth) {
            let cursorX = GUTTER;
            let cursorY = GUTTER;
            let maxRowHeight = 0;

            for (const element of elements) {
                if (element.type === 'A') {
                    if (cursorX > GUTTER) {
                        cursorX = GUTTER;
                        cursorY += maxRowHeight + GUTTER;
                    }

                    const text = new paper.PointText({
                        point: [canvasWidth / 2, cursorY + element.fontSize * UNIT],
                        content: element.text,
                        fontFamily: FONT_NAME,
                        fontSize: element.fontSize * UNIT,
                        fontWeight: 'bold',
                        fillColor: 'black',
                        justification: 'center'
                    });

                    cursorY += element.fontSize * UNIT + GUTTER;
                    cursorX = GUTTER;
                    maxRowHeight = 0;

                } else if (element.type === 'B') {
                    const icon = await createIcon(element.icon, ICON_SIZE, element.svgPath);
                    const bounds = icon.bounds;
                    const itemWidth = Math.ceil(bounds.width / GRID_SIZE) * GRID_SIZE;
                    const itemHeight = Math.ceil(bounds.height / GRID_SIZE) * GRID_SIZE;

                    if (cursorX + itemWidth > canvasWidth) {
                        cursorX = GUTTER;
                        cursorY += maxRowHeight + GUTTER;
                        maxRowHeight = 0;
                    }

                    icon.position = new paper.Point(cursorX + bounds.width / 2, cursorY + bounds.height / 2);
                    cursorX += itemWidth + GUTTER;
                    maxRowHeight = Math.max(maxRowHeight, itemHeight);

                } else if (element.type === 'C') {
                    const rowHeight = UNIT * 1.2;
                    const group = new paper.Group();

                    element.rows.forEach((row, i) => {
                        const y = (i + 1) * rowHeight;
                        const label = new paper.PointText({
                            point: [0, y],
                            content: row.label,
                            fontFamily: FONT_NAME,
                            fontSize: UNIT * 0.8,
                            fillColor: 'black',
                            justification: 'left'
                        });
                        const value = new paper.PointText({
                            point: [label.bounds.width + GUTTER, y],
                            content: row.value,
                            fontFamily: FONT_NAME,
                            fontSize: UNIT * 0.8,
                            fillColor: 'black',
                            justification: 'left'
                        });
                        group.addChildren([label, value]);
                    });

                    const bounds = group.bounds;
                    const tableWidth = Math.ceil(bounds.width / GRID_SIZE) * GRID_SIZE;
                    const tableHeight = bounds.height;

                    if (cursorX + tableWidth > canvasWidth) {
                        cursorX = GUTTER;
                        cursorY += maxRowHeight + GUTTER;
                        maxRowHeight = 0;
                    }

                    group.position = new paper.Point(cursorX + bounds.width / 2, cursorY + bounds.height / 2);
                    cursorX += tableWidth + GUTTER;
                    maxRowHeight = Math.max(maxRowHeight, tableHeight);
                }
            }

            return {
                width: canvasWidth,
                height: cursorY + maxRowHeight + GUTTER
            };
        }

        async function render() {
            paper.project.clear();

            // Set canvas size
            paper.view.viewSize = new paper.Size(CANVAS_WIDTH, CANVAS_HEIGHT);

            // Measure at base UNIT
            UNIT = BASE_UNIT;
            GRID_SIZE = UNIT;
            GUTTER = UNIT * 0.5;
            ICON_SIZE = UNIT * 2;

            const bounds = await renderContent(CANVAS_WIDTH);
            paper.project.clear();

            // Calculate scale
            const scaleX = CANVAS_WIDTH / bounds.width;
            const scaleY = CANVAS_HEIGHT / bounds.height;
            const scale = Math.min(scaleX, scaleY, 1);

            // Apply scale
            UNIT = BASE_UNIT * scale;
            GRID_SIZE = UNIT;
            GUTTER = UNIT * 0.5;
            ICON_SIZE = UNIT * 2;

            // Render scaled
            const finalBounds = await renderContent(CANVAS_WIDTH);

            // Center
            const offsetX = (CANVAS_WIDTH - finalBounds.width) / 2;
            const offsetY = (CANVAS_HEIGHT - finalBounds.height) / 2;
            paper.project.activeLayer.position = paper.project.activeLayer.position.add(new paper.Point(offsetX, offsetY));

            // Draw grid
            if (showGrid) {
                for (let x = 0; x < CANVAS_WIDTH; x += GRID_SIZE) {
                    new paper.Path.Line({
                        from: [x, 0],
                        to: [x, CANVAS_HEIGHT],
                        strokeColor: '#aaa',
                        strokeWidth: 0.5
                    }).sendToBack();
                }
                for (let y = 0; y < CANVAS_HEIGHT; y += GRID_SIZE) {
                    new paper.Path.Line({
                        from: [0, y],
                        to: [CANVAS_WIDTH, y],
                        strokeColor: '#aaa',
                        strokeWidth: 0.5
                    }).sendToBack();
                }
            }

            paper.view.draw();
        }

        window.addEventListener('load', async () => {
            paper.setup(document.getElementById('canvas'));

            // Wait for fonts to load
            await document.fonts.ready;

            await loadFont();
            await render();

            // Auto-apply canvas size on input change
            document.getElementById('canvas-width').addEventListener('change', async (e) => {
                CANVAS_WIDTH = parseInt(e.target.value) || 600;
                await render();
            });

            document.getElementById('canvas-height').addEventListener('change', async (e) => {
                CANVAS_HEIGHT = parseInt(e.target.value) || 400;
                await render();
            });

            // Grid toggle
            document.getElementById('grid-toggle').addEventListener('change', async (e) => {
                showGrid = e.target.checked;
                await render();
            });

            // Font file upload
            document.getElementById('font-file').addEventListener('change', async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = async (event) => {
                    const arrayBuffer = event.target.result;
                    const fontName = file.name.replace(/\.(ttf|otf|woff|woff2)$/i, '');
                    await loadFont(arrayBuffer, fontName);
                    await render();
                };
                reader.readAsArrayBuffer(file);
            });

            // Handle dragging for canvas resize
            const handles = document.querySelectorAll('.canvas-handle');
            handles.forEach(handle => {
                handle.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    const corner = handle.dataset.corner;
                    const startX = e.clientX;
                    const startY = e.clientY;
                    const startWidth = CANVAS_WIDTH;
                    const startHeight = CANVAS_HEIGHT;

                    async function onMouseMove(e) {
                        const deltaX = (e.clientX - startX) * 2; // *2 for center resize
                        const deltaY = (e.clientY - startY) * 2;

                        let newWidth = startWidth;
                        let newHeight = startHeight;

                        if (corner === 'br' || corner === 'tr') {
                            newWidth = startWidth + deltaX;
                        } else {
                            newWidth = startWidth - deltaX;
                        }

                        if (corner === 'br' || corner === 'bl') {
                            newHeight = startHeight + deltaY;
                        } else {
                            newHeight = startHeight - deltaY;
                        }

                        CANVAS_WIDTH = Math.max(200, newWidth);
                        CANVAS_HEIGHT = Math.max(150, newHeight);

                        document.getElementById('canvas-width').value = Math.round(CANVAS_WIDTH);
                        document.getElementById('canvas-height').value = Math.round(CANVAS_HEIGHT);

                        await render();
                    }

                    function onMouseUp() {
                        document.removeEventListener('mousemove', onMouseMove);
                        document.removeEventListener('mouseup', onMouseUp);
                    }

                    document.addEventListener('mousemove', onMouseMove);
                    document.addEventListener('mouseup', onMouseUp);
                });
            });

            // Drag and drop for sidebar items
            function updateSidebar() {
                const sidebar = document.getElementById('sidebar-list');
                sidebar.innerHTML = '';
                elements.forEach((el, idx) => {
                    const div = document.createElement('div');
                    div.className = 'sidebar-item';
                    div.draggable = true;
                    div.dataset.index = idx;
                    if (el.type === 'A') div.textContent = `SPANNER: ${el.text}`;
                    else if (el.type === 'B') div.textContent = `BLOCK: ${el.label}`;
                    else if (el.type === 'C') div.textContent = `DATA (${el.rows.length} rows)`;

                    div.addEventListener('dragstart', (e) => {
                        e.dataTransfer.effectAllowed = 'move';
                        e.dataTransfer.setData('text/html', idx);
                        div.classList.add('dragging');
                    });

                    div.addEventListener('dragend', () => {
                        div.classList.remove('dragging');
                    });

                    div.addEventListener('dragover', (e) => {
                        e.preventDefault();
                        e.dataTransfer.dropEffect = 'move';
                        div.classList.add('drag-over');
                    });

                    div.addEventListener('dragleave', () => {
                        div.classList.remove('drag-over');
                    });

                    div.addEventListener('drop', async (e) => {
                        e.preventDefault();
                        div.classList.remove('drag-over');
                        const fromIdx = parseInt(e.dataTransfer.getData('text/html'));
                        const toIdx = parseInt(div.dataset.index);

                        if (fromIdx !== toIdx) {
                            const item = elements.splice(fromIdx, 1)[0];
                            elements.splice(toIdx, 0, item);
                            updateSidebar();
                            await render();
                        }
                    });

                    div.addEventListener('click', () => {
                        showEditPanel(idx);
                    });

                    sidebar.appendChild(div);
                });
            }

            updateSidebar();

            // Edit panel functions
            function showEditPanel(index) {
                selectedElementIndex = index;
                const element = elements[index];
                const panel = document.getElementById('edit-panel');
                const form = document.getElementById('edit-form');

                panel.classList.add('visible');

                let html = '';

                // Type selector
                html += `<label>TYPE:
                    <select id="edit-type">
                        <option value="A" ${element.type === 'A' ? 'selected' : ''}>A - SPANNER</option>
                        <option value="B" ${element.type === 'B' ? 'selected' : ''}>B - BLOCK</option>
                        <option value="C" ${element.type === 'C' ? 'selected' : ''}>C - DATA</option>
                    </select>
                </label>`;

                // Type-specific fields
                if (element.type === 'A') {
                    html += `
                        <label>TEXT:
                            <input type="text" id="edit-text" value="${element.text || ''}">
                        </label>
                        <label>FONT SIZE (units):
                            <input type="number" id="edit-fontsize" value="${element.fontSize || 1.2}" step="0.1">
                        </label>
                    `;
                } else if (element.type === 'B') {
                    html += `
                        <label>ICON:
                            <select id="edit-icon">
                                <option value="square" ${element.icon === 'square' ? 'selected' : ''}>Square</option>
                                <option value="circle" ${element.icon === 'circle' ? 'selected' : ''}>Circle</option>
                                <option value="triangle" ${element.icon === 'triangle' ? 'selected' : ''}>Triangle</option>
                                <option value="lightning" ${element.icon === 'lightning' ? 'selected' : ''}>Lightning</option>
                                <option value="skull" ${element.icon === 'skull' ? 'selected' : ''}>Skull</option>
                                <option value="svg" ${element.icon === 'svg' ? 'selected' : ''}>SVG File</option>
                            </select>
                        </label>
                        <label>LABEL:
                            <input type="text" id="edit-label" value="${element.label || ''}">
                        </label>
                        <label id="svg-path-label" style="display: ${element.icon === 'svg' ? 'block' : 'none'}">SVG PATH:
                            <input type="text" id="edit-svgpath" value="${element.svgPath || ''}">
                        </label>
                    `;
                } else if (element.type === 'C') {
                    html += `<label>TABLE ROWS:</label><div class="table-rows" id="table-rows">`;
                    element.rows.forEach((row, i) => {
                        html += `
                            <div class="table-row-item">
                                <input type="text" placeholder="Label" value="${row.label}" data-row="${i}" data-field="label" style="flex: 1">
                                <input type="text" placeholder="Value" value="${row.value}" data-row="${i}" data-field="value" style="flex: 1">
                                <button class="danger" onclick="deleteRow(${i})">×</button>
                            </div>
                        `;
                    });
                    html += `</div>
                        <button onclick="addRow()">+ ADD ROW</button>
                    `;
                }

                html += `
                    <div style="margin-top: 15px;">
                        <button onclick="saveElement()">SAVE</button>
                        <button class="danger" onclick="deleteElement()">DELETE</button>
                    </div>
                `;

                form.innerHTML = html;

                // Add event listeners
                document.getElementById('edit-type')?.addEventListener('change', (e) => {
                    const newType = e.target.value;
                    const el = elements[selectedElementIndex];

                    if (newType === 'A') {
                        elements[selectedElementIndex] = { type: 'A', text: 'NEW HEADER', fontSize: 1.2 };
                    } else if (newType === 'B') {
                        elements[selectedElementIndex] = { type: 'B', icon: 'square', label: 'NEW BLOCK' };
                    } else if (newType === 'C') {
                        elements[selectedElementIndex] = { type: 'C', rows: [{ label: 'LABEL', value: 'VALUE' }] };
                    }

                    showEditPanel(selectedElementIndex);
                });

                document.getElementById('edit-icon')?.addEventListener('change', (e) => {
                    const svgLabel = document.getElementById('svg-path-label');
                    svgLabel.style.display = e.target.value === 'svg' ? 'block' : 'none';
                });

                // Update sidebar selection
                document.querySelectorAll('.sidebar-item').forEach((item, i) => {
                    item.classList.toggle('selected', i === index);
                });
            }

            window.saveElement = async function () {
                const element = elements[selectedElementIndex];

                if (element.type === 'A') {
                    element.text = document.getElementById('edit-text').value;
                    element.fontSize = parseFloat(document.getElementById('edit-fontsize').value);
                } else if (element.type === 'B') {
                    element.icon = document.getElementById('edit-icon').value;
                    element.label = document.getElementById('edit-label').value;
                    if (element.icon === 'svg') {
                        element.svgPath = document.getElementById('edit-svgpath').value;
                    } else {
                        delete element.svgPath;
                    }
                } else if (element.type === 'C') {
                    const rows = [];
                    document.querySelectorAll('.table-row-item').forEach(item => {
                        const inputs = item.querySelectorAll('input');
                        rows.push({
                            label: inputs[0].value,
                            value: inputs[1].value
                        });
                    });
                    element.rows = rows;
                }

                updateSidebar();
                await render();
            };

            window.deleteElement = async function () {
                if (confirm('Delete this element?')) {
                    elements.splice(selectedElementIndex, 1);
                    selectedElementIndex = null;
                    document.getElementById('edit-panel').classList.remove('visible');
                    updateSidebar();
                    await render();
                }
            };

            window.addRow = function () {
                const element = elements[selectedElementIndex];
                element.rows.push({ label: 'NEW LABEL', value: 'NEW VALUE' });
                showEditPanel(selectedElementIndex);
            };

            window.deleteRow = function (rowIndex) {
                const element = elements[selectedElementIndex];
                element.rows.splice(rowIndex, 1);
                showEditPanel(selectedElementIndex);
            };

            document.getElementById('add-element').addEventListener('click', () => {
                elements.push({ type: 'A', text: 'NEW ELEMENT', fontSize: 1.2 });
                updateSidebar();
                showEditPanel(elements.length - 1);
            });
        });
    </script>
</body>

</html>
